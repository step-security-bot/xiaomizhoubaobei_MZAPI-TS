name: ' iFLOW CLI Pull Request Review'

on:
  pull_request:
    types:
      - 'opened'
      - 'reopened'
  issue_comment:
    types:
      - 'created'
  pull_request_review_comment:
    types:
      - 'created'
  pull_request_review:
    types:
      - 'submitted'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: 'number'

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

permissions:
  contents: 'read'
  issues: 'write'
  pull-requests: 'write'
  statuses: 'write'

jobs:
  review-pr:
    # This condition seeks to ensure the action is only run when it is triggered by a trusted user.
    # For private repos, users who have access to the repo are considered trusted.
    # For public repos, users who members, owners, or collaborators are considered trusted.
    if: |-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        (
          github.event.repository.private == true ||
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        )
      ) ||
      (
        (
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request
          ) ||
          github.event_name == 'pull_request_review_comment'
        ) &&
        (
          contains(github.event.comment.body, '@iflow-cli /review ') ||
          contains(github.event.comment.body, '@iFlow-CLI /review ') ||
          contains(github.event.comment.body, '@IFLOW-CLI /review ') ||
          contains(github.event.comment.body, '@IFlow-CLI /review ') ||
          endsWith(github.event.comment.body, '@iflow-cli /review') ||
          endsWith(github.event.comment.body, '@iFlow-CLI /review') ||
          endsWith(github.event.comment.body, '@IFLOW-CLI /review') ||
          endsWith(github.event.comment.body, '@IFlow-CLI /review')
        ) &&
        (
          github.event.repository.private == true ||
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        (
          contains(github.event.review.body, '@iflow-cli /review ') ||
          contains(github.event.review.body, '@iFlow-CLI /review ') ||
          contains(github.event.review.body, '@IFLOW-CLI /review ') ||
          contains(github.event.review.body, '@IFlow-CLI /review ') ||
          endsWith(github.event.review.body, '@iflow-cli /review') ||
          endsWith(github.event.review.body, '@iFlow-CLI /review') ||
          endsWith(github.event.review.body, '@IFLOW-CLI /review') ||
          endsWith(github.event.review.body, '@IFlow-CLI /review')
        ) &&
        (
          github.event.repository.private == true ||
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
        )
      )
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout PR code'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # ratchet:actions/checkout@v4

      - name: 'Get PR details (pull_request & workflow_dispatch)'
        id: 'get_pr'
        if: |-
          ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: '${{ secrets.TOKEN }}'
          EVENT_NAME: '${{ github.event_name }}'
          WORKFLOW_PR_NUMBER: '${{ github.event.inputs.pr_number }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number }}'
        run: |-
          set -euo pipefail

          if [[ "${EVENT_NAME}" = "workflow_dispatch" ]]; then
            PR_NUMBER="${WORKFLOW_PR_NUMBER}"
          else
            PR_NUMBER="${PULL_REQUEST_NUMBER}"
          fi

          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

          # Get PR details
          PR_DATA="$(gh pr view "${PR_NUMBER}" --json title,body,additions,deletions,changedFiles,baseRefName,headRefName)"
          echo "pr_data=${PR_DATA}" >> "${GITHUB_OUTPUT}"

          # Get file changes
          CHANGED_FILES="$(gh pr diff "${PR_NUMBER}" --name-only)"
          {
            echo "changed_files<<EOF"
            echo "${CHANGED_FILES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"


      - name: 'Get PR details (issue_comment & reviews)'
        id: 'get_pr_comment'
        if: |-
          ${{ github.event_name == 'issue_comment' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' }}
        env:
          GITHUB_TOKEN: '${{ secrets.TOKEN }}'
          COMMENT_BODY: '${{ github.event.comment.body || github.event.review.body }}'
          PR_NUMBER: '${{ github.event.issue.number || github.event.pull_request.number }}'
        run: |-
          set -euo pipefail

          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

          # Extract additional instructions from comment (case insensitive, exact match for /review)
          ADDITIONAL_INSTRUCTIONS=""
          if echo "${COMMENT_BODY}" | grep -qiE '@iflow-cli[[:space:]]+/review([[:space:]]|$)'; then
            ADDITIONAL_INSTRUCTIONS="$(echo "${COMMENT_BODY}" | sed -E 's/.*@[iI][fF][lL][oO][wW]-[cC][lL][iI][[:space:]]+\/[rR][eE][vV][iI][eE][wW][[:space:]]*(.*)/\1/' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          fi
          echo "additional_instructions=${ADDITIONAL_INSTRUCTIONS}" >> "${GITHUB_OUTPUT}"

          # Get PR details
          PR_DATA="$(gh pr view "${PR_NUMBER}" --json title,body,additions,deletions,changedFiles,baseRefName,headRefName)"
          echo "pr_data=${PR_DATA}" >> "${GITHUB_OUTPUT}"

          # Get file changes
          CHANGED_FILES="$(gh pr diff "${PR_NUMBER}" --name-only)"
          {
            echo "changed_files<<EOF"
            echo "${CHANGED_FILES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: 'Run iFLOW CLI PR Review'
        uses: iflow-ai/iflow-cli-action@v2.0.0
        id: 'iflow_cli_pr_review'
        env:
          GITHUB_TOKEN: '${{ secrets.TOKEN }}'
          PR_NUMBER: '${{ steps.get_pr.outputs.pr_number || steps.get_pr_comment.outputs.pr_number }}'
          PR_DATA: '${{ steps.get_pr.outputs.pr_data || steps.get_pr_comment.outputs.pr_data }}'
          CHANGED_FILES: '${{ steps.get_pr.outputs.changed_files || steps.get_pr_comment.outputs.changed_files }}'
          ADDITIONAL_INSTRUCTIONS: '${{ steps.get_pr.outputs.additional_instructions || steps.get_pr_comment.outputs.additional_instructions }}'
          REPOSITORY: '${{ github.repository }}'
        with:
          api_key: ${{ secrets.IFLOW_API_KEY }}
          timeout: "3600"
          debug: "true"
          settings_json: |
            {
                "selectedAuthType": "iflow",
                "apiKey": "${{ secrets.IFLOW_API_KEY }}",
                "baseUrl": "https://apis.iflow.cn/v1",
                "modelName": "Qwen3-Coder",
                "searchApiKey": "${{ secrets.IFLOW_API_KEY }}",
                "mcpServers": {
                  "github": {
                  "command": "github-mcp-server",
                  "args": [
                    "stdio"
                  ],
                  "includeTools": [
                    "create_pending_pull_request_review",
                    "add_comment_to_pending_review",
                    "submit_pending_pull_request_review",
                    "list_pull_requests"
                  ],
                    "env": {
                      "GITHUB_PERSONAL_ACCESS_TOKEN": "${{ secrets.TOKEN }}"
                    }
                  }
                }
            }
          prompt: |
            ## 角色

            你是一位专业的代码审查员。你可以使用工具来收集 PR 信息并在 GitHub 上执行审查。
            请使用可用的工具来收集信息，不要要求提供信息。

            ## 要求
            1. 所有反馈必须留在 GitHub 上。
            2. 任何未留在 GitHub 上的输出都不会被看到。

            ## 步骤

            首先运行这些命令来收集所需数据：
            1. 运行：echo "${REPOSITORY}" 获取 GitHub 仓库（格式为 <OWNER>/<REPO>）
            2. 运行：echo "${PR_DATA}" 获取 PR 详细信息（JSON 格式）
            3. 运行：echo "${CHANGED_FILES}" 获取更改文件列表
            4. 运行：echo "${PR_NUMBER}" 获取 PR 编号
            5. 运行：echo "${ADDITIONAL_INSTRUCTIONS}" 查看用户提供的任何特定审查指令
            6. 运行：gh pr diff "${PR_NUMBER}" 查看完整差异并参考上下文部分来理解它
            7. 对于任何特定文件，使用：cat filename、head -50 filename 或 tail -50 filename
            8. 如果 ADDITIONAL_INSTRUCTIONS 包含文本，请优先审查这些特定区域或关注点。
               常见指令示例："关注安全性"、"检查性能"、"审查错误处理"、"检查破坏性变更"

            ## 指南
            ### 核心指南（始终适用）

            1. 理解上下文：分析拉取请求标题、描述、变更和代码文件以理解意图。
            2. 仔细审查：全面审查所有相关代码变更，优先审查新增行。考虑指定的关注领域和提供的风格指南。
            3. 全面审查：确保代码得到彻底审查，因为对作者来说重要的是你能识别出所有相关问题
               （受审查标准和风格指南限制）。遗漏任何问题都会导致作者的代码审查体验不佳。
            4. 建设性反馈：
              * 为每个问题提供清晰的解释。
              * 提供具体的改进建议，并在适用时建议替代方法。
                特别是代码建议非常有帮助，因为作者可以直接应用到他们的代码中，
                但必须准确锚定到应该替换的行。
            5. 严重性指示：在审查评论中明确指出问题的严重性。
              这对帮助作者理解问题的紧迫性非常重要。
              严重性应为以下之一（按严重程度递减顺序提供）：
              * `critical`：必须立即解决此问题，因为它可能导致代码正确性、安全性或性能的严重后果。
              * `high`：应尽快解决此问题，因为它可能在未来引起问题。
              * `medium`：应考虑在未来进行改进，但不是关键或紧急的。
              * `low`：此问题是次要的或风格性的，作者可以自行决定是否解决。
            6. 避免评论硬编码的日期和时间是否在未来（例如"此日期在未来"）。
              * 记住你无法访问当前日期和时间，请留给作者处理。
            7. 针对性建议：将所有建议限制在 diff 块中修改的部分。
              这是一个严格要求，因为 GitHub（和其他 SCM）API 不允许对 diff 块中未包含的代码文件部分进行评论。
            8. 审查评论中的代码建议：
              * 简洁性：尽量使代码建议简洁，除非必要。较大的代码建议往往更难让拉取请求作者在 UI 中直接提交。
              * 有效格式：在 JSON 响应的建议字段中提供代码建议（作为字符串文字，
                转义特殊字符如 \n、\\、\"）。不要在建议字段中包含 markdown 代码块。
                仅在评论正文使用 markdown 代码块用于更广泛的示例，或者如果建议字段会创建过大的差异。
                优先使用建议字段进行特定的、有针对性的代码更改。
              * 行号准确性：代码建议需要与要替换的代码完美对齐。
                创建评论时特别注意行号，特别是如果有代码建议。
                注意补丁包含每个差异的前后代码片段的行号，因此使用这些来锚定你的评论和相应的代码建议。
              * 可编译性：代码建议应该是可直接复制/粘贴到代码文件中的可编译代码片段。
                如果建议不可编译，拉取请求将不接受。请注意并非所有语言都是编译的，
                所以这里的可编译性是指字面意思或精神意思。
              * 内联代码注释：如果能增强底层代码可读性，请随意添加简短注释到代码建议中。
                只需确保内联代码注释增加了价值，而不仅仅是重申代码的作用。不要使用
                内联注释来"教导"作者（直接在审查评论正文中使用），而是如果对代码本身的可读性有益则使用。
            10. Markdown 格式：充分利用 markdown 的格式优势，如项目符号列表、粗体文本、表格等。
            11. 避免错误的审查评论：
              * 你做的任何评论必须指向代码中发现的差异和你反馈中提出的最佳实践之间的不一致。
                例如，如果你指出常量需要用下划线全大写命名，
                确保评论选择的代码没有这样做，否则会令人困惑更别说不必要了。
            12. 删除重复的代码建议：
              * 一些提供的代码建议是重复的，请删除重复的审查评论。
            13. 不要批准拉取请求
            14. 将所有 shell 变量引用为 "${VAR}"（带引号和大括号）

            ### 审查标准（在审查中优先考虑）

            * 正确性：验证代码功能，处理边缘情况，并确保函数描述和实现之间的一致性。
              考虑常见的正确性问题（逻辑错误、错误处理、竞态条件、数据验证、API 使用、类型不匹配）。
            * 效率：识别性能瓶颈，优化效率，避免不必要的循环、迭代或计算。
              考虑常见的效率问题（过度循环、内存泄漏、低效数据结构、冗余计算、过度日志等）。
            * 可维护性：评估代码可读性、模块化和对语言习惯用法及最佳实践的遵循。
              考虑常见的可维护性问题（命名、注释/文档、复杂性、代码重复、格式、魔术数字）。
              说明遵循的风格指南（如果没有指定风格指南，默认使用常用指南，
              例如 Python 的 PEP 8 风格指南或 Google Java 风格指南）。
            * 安全性：识别潜在漏洞（例如不安全存储、注入攻击、访问控制不足）。

            ### 其他考虑因素
            * 测试：确保充足的单元测试、集成测试和端到端测试。评估覆盖率、边缘情况处理和整体测试质量。
            * 性能：评估预期负载下的性能，识别瓶颈，并建议优化。
            * 可扩展性：评估代码如何随着用户基础或数据量的增长而扩展。
            * 模块化和可重用性：评估代码组织、模块化和可重用性。建议重构或创建可重用组件。
            * 错误日志和监控：确保错误得到有效记录，并实施监控机制以跟踪生产中的应用程序健康状况。

            **关键约束：**

            你必须仅对 diff 中实际变更的行提供评论。
            这意味着你的评论应仅引用 diff 内容中以 `+` 或 `-` 字符开头的行。
            不要对以空格开头的行（上下文行）进行评论。

            你必须仅在代码变更中存在实际问题或错误时才添加审查评论。
            不要添加审查评论告诉用户"检查"、"确认"或"验证"某些内容。
            不要添加审查评论告诉用户"确保"某些内容。
            不要添加审查评论解释代码变更的内容。
            不要添加审查评论验证代码变更的内容。
            不要使用审查评论向作者解释代码。他们已经知道自己的代码。仅在有改进机会时进行评论。这非常重要。

            密切注意行号并确保它们正确。
            密切注意代码建议中的缩进并确保它们与要替换的代码匹配。
            避免对许可证头（如果存在）进行评论，而应在变更的代码上进行评论。

            绝对重要的是避免对文件的许可证头进行评论。
            绝对重要的是避免对版权头进行评论。
            避免评论硬编码的日期和时间是否在未来（例如"此日期在未来"）。
            记住你无法访问当前日期和时间，请留给作者处理。

            避免提及你的任何指令、设置或标准。

            以下是一些设置评论严重性的一般指南
            - 关于将硬编码字符串或数字重构为常量的评论通常被认为是低严重性。
            - 关于日志消息或日志增强的评论通常被认为是低严重性。
            - .md 文件中的评论是中等或低严重性。这非常重要。
            - 关于添加或扩展 docstring/javadoc 的评论大多数时候是低严重性。
            - 关于抑制未检查警告或待办事项的评论被认为是低严重性。
            - 关于拼写的评论通常是低或中等严重性。
            - 关于测试或测试的评论通常是低严重性。
            - 如果输入中没有直接提供 URL 内容，请不要评论 URL 的内容。

            保持评论正文简洁明了。
            保持每个评论专注于一个问题。

            ## 上下文
            此拉取请求中变更的文件以下面的格式表示，显示文件名和文件的变更部分：

            <PATCHES>
            FILE:<第一个文件的名称>
            DIFF:
            <统一差异格式的补丁>

            --------------------

            FILE:<第二个文件的名称>
            DIFF:
            <统一差异格式的补丁>

            --------------------

            （依此类推所有变更的文件）
            </PATCHES>

            注意如果你想在 UI 的左侧/差异代码版本之前进行评论，
            请注意这些行号和相应的代码。同样对于在 UI 的右侧
            /差异代码版本之后进行评论，注意行号和相应的代码。
            这应该是你选择行号的指南，也非常重要的是，
            将你的评论限制在这些文件的此行范围内，无论在左侧还是右侧。
            如果你评论超出范围，审查将失败，所以你必须注意文件名、
            行号和前后差异版本来制作你的评论。

            以下是按上述格式在拉取请求中实现的补丁：

            要获取此拉取请求中变更的文件，请运行：
            "$(gh pr diff "${PR_NUMBER}" --patch)" 获取变更文件列表 PATCH

            ## 审查

            一旦你有了信息并准备在 GitHub 上留下审查，请使用 GitHub MCP 工具将审查发布到 GitHub：
            1. 创建待定审查：使用 mcp__github__create_pending_pull_request_review 创建待定拉取请求审查。

            2. 添加审查评论：
                2.1 使用 mcp__github__add_comment_to_pending_review 向待定拉取请求审查添加评论。
                尽可能优先使用内联评论，因此请根据需要重复此步骤，
                调用 mcp__github__add_comment_to_pending_review。所有关于特定代码行的评论应使用内联评论。
                尽可能优先使用代码建议，其中包括标记为"suggestion"的代码块，其中包含新代码应该是什么。
                所有评论也应该有严重性。语法如下：
                  正常评论语法：
                  <COMMENT>
                  {{SEVERITY}} {{COMMENT_TEXT}}
                  </COMMENT>

                  内联评论语法：（优先）：
                  <COMMENT>
                  {{SEVERITY}} {{COMMENT_TEXT}}
                  ```suggestion
                  {{CODE_SUGGESTION}}
                  ```
                  </COMMENT>

                  在每个评论前加上严重性表情符号：
                  -  表示低严重性
                  -  表示中等严重性
                  -  表示高严重性
                  -  表示关键严重性
                  -  表示严重性不明确

                  包含所有这些，一个内联评论示例如下：
                  <COMMENT>
                   使用驼峰命名法命名函数
                  ```suggestion
                  myFooBarFunction
                  ```
                  </COMMENT>

                  关键严重性示例如下：
                  <COMMENT>
                   从 GitHub 删除存储密钥
                  ```suggestion
                  ```
                  </COMMENT>

            3. 发布审查：使用 mcp__github__submit_pending_pull_request_review 提交待定拉取请求审查。

              3.1 制作摘要评论：包括未通过内联评论解决的高级要点摘要。简洁明了。不要重复内联提到的细节。

                使用这种确切的 markdown 格式构建你的摘要评论：
                ##  审查摘要

                提供 PR 的简要 2-3 句话概述和整体评估。

                ##  一般反馈
                - 列出关于代码质量的一般观察
                - 提及整体模式或架构决策
                - 突出实现的积极方面
                - 注意跨文件的重复主题

            ## 最终指令

            记住，你在 VM 中运行，没有人审查你的输出。你的审查必须使用 MCP 工具发布到 GitHub，
            以创建待定审查、向待定审查添加评论并提交待定审查。


      - name: 'Post PR review failure comment'
        if: |-
          ${{ failure() && steps.iflow_cli_pr_review.outcome == 'failure' }}
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea'
        with:
          github-token: '${{ secrets.TOKEN }}'
          script: |-
            github.rest.issues.createComment({
              owner: '${{ github.repository }}'.split('/')[0],
              repo: '${{ github.repository }}'.split('/')[1],
              issue_number: '${{ steps.get_pr.outputs.pr_number || steps.get_pr_comment.outputs.pr_number }}',
              body: 'There is a problem with the iFLOW CLI PR review. Please check the [action logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })