name: 'iFlow CLI Issue Killer'

on:
  issue_comment:
    types:
      - 'created'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'issue number to implement'
        required: true
        type: 'number'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

permissions:
  contents: 'write'
  issues: 'write'
  pull-requests: 'write'

jobs:
  implement-issue:
    if: |-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@iflow-cli /issue-killer') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Get Issue Details
        id: get_issue
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea'
        with:
          github-token: ${{ secrets.TOKEN }}
          script: |
            const issue_number = process.env.INPUT_ISSUE_NUMBER || context.issue.number;
            core.setOutput('issue_number', issue_number);
            
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issue_number)
            });
            
            core.setOutput('issue_title', issue.data.title);
            core.setOutput('issue_body', issue.data.body);
            
            // Parse implementation request from comment or use issue body
            let implementation_request = issue.data.body;
            if (context.eventName === 'issue_comment') {
              implementation_request = context.payload.comment.body.replace('@iflow-cli /issue-killer', '').trim();
              if (implementation_request === '') {
                implementation_request = issue.data.body;
              }
            }
            
            core.setOutput('implementation_request', implementation_request);

      - name: 'Run iFlow CLI Implementation'
        uses: iflow-ai/iflow-cli-action@v2.0.0
        id: 'iflow_cli_implementation'
        env:
          GITHUB_TOKEN: '${{ secrets.TOKEN }}'
          ISSUE_TITLE: '${{ steps.get_issue.outputs.issue_title }}'
          ISSUE_BODY: '${{ steps.get_issue.outputs.issue_body }}'
          ISSUE_NUMBER: '${{ steps.get_issue.outputs.issue_number }}'
          REPOSITORY: '${{ github.repository }}'
        with:
          api_key: ${{ secrets.IFLOW_API_KEY }}
          timeout: "1800"
          debug: "true"
          settings_json: |
            {
                "selectedAuthType": "iflow",
                "apiKey": "${{ secrets.IFLOW_API_KEY }}",
                "baseUrl": "https://apis.iflow.cn/v1",
                "modelName": "Qwen3-Coder",
                "searchApiKey": "${{ secrets.IFLOW_API_KEY }}",
                "mcpServers": {
                  "github": {
                  "command": "github-mcp-server",
                  "args": [
                    "stdio"
                  ],
                  "includeTools": [
                    "create_pull_request",
                    "list_pull_requests",
                    "add_issue_comment"
                  ],
                    "env": {
                      "GITHUB_PERSONAL_ACCESS_TOKEN": "${{ secrets.TOKEN }}"
                    }
                  }
                }
            }
          prompt: |
            ## 角色

            你是一个实现助手。你的任务是根据提供的 GitHub issue 实现一个功能。
            请按照以下步骤操作：

            1. **首先**：使用 GitHub MCP 工具在 issue 上创建开始评论
            2. 分析环境变量中提供的 issue 标题和内容：
               "${ISSUE_TITLE}" 和 "${ISSUE_BODY}"。
            3. 如果触发此操作的评论包含额外的实现指令，也要使用这些指令。
            4. 通过创建或修改文件来实现请求的功能。
            5. 确保所有更改都完整且正确地符合 issue 要求。
            6. 除了必需的开始和完成评论外，不要添加评论或修改 issue 内容。
            7. 仅专注于实现当前 issue。

            ## 创建开始评论

            在开始实现之前，使用 GitHub MCP 工具在 issue 上创建开始评论：
            1. 使用 add_issue_comment 向 issue #${ISSUE_NUMBER} 添加评论
            2. 开始评论应包括：
               -  通知实现任务已开始
               -  提及 iFlow CLI Issue Killer 正在处理该 issue
               -  当前状态：正在分析和实现功能
               -  **执行计划**：根据 issue 要求制定的实现步骤简要大纲
               - ⏱️ 预计时间：通常需要几分钟到十分钟
               -  **查看执行日志**：[GitHub Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
               -  注意这是自动评论，后续会有完成通知
            3. 对于执行计划，请分析 issue 要求并提供清晰的编号实现步骤列表，例如：
               - 要创建或修改的文件
               - 要实现的关键功能
               - 要添加或更新的测试
               - 要更改的依赖项或配置

            ## 指南

            - 进行所有必要的代码更改以实现功能
            - 确保新代码遵循现有的项目约定
            - 如适用，请添加或修改测试
            - 将所有 shell 变量引用为 "${VAR}"（带引号和大括号）
            
            ## 创建 Pull Request
            
            实现功能后，使用 GitHub MCP 工具创建 pull request：
            1. 使用 create_pull_request 创建 Pull Request。
            2. PR 应该从一个具有描述性名称的新分支创建
               （例如 feature/issue-${ISSUE_NUMBER}、fix/issue-${ISSUE_NUMBER}，
               或基于功能的描述性名称）
            3. PR 标题应该具有描述性并引用 issue 编号
            4. PR 正文应解释实现了什么并引用 issue
            5. 记住你创建的分支名称，因为如果 PR 创建失败，
               在完成评论中会需要它
            
            ## 创建完成评论
            
            成功实现功能并创建 PR 后，使用 GitHub MCP 工具向 issue 添加完成评论：
            1. 使用 add_issue_comment 向 issue #${ISSUE_NUMBER} 添加评论
            2. 评论应包括：
               - ✅ 确认 issue 已实现
               -  简要总结已完成的内容
               -  关键更改列表
               -  创建的 Pull Request 链接（如果成功）
               -  如果 PR 创建失败，请使用你创建的实际分支名称提供手动 PR 创建链接，
                  如：https://github.com/${{ github.repository }}/compare/main...[YOUR_BRANCH_NAME]
               -  注意这是自动实现
            3. 使用友好的语气并包含适当的 emoji 以获得更好的用户体验

      - name: 'Post Implementation Failure Comment'
        if: |-
          ${{ failure() && steps.iflow_cli_implementation.outcome == 'failure' }}
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea'
        with:
          github-token: '${{ secrets.TOKEN }}'
          script: |-
            github.rest.issues.createComment({
              owner: '${{ github.repository }}'.split('/')[0],
              repo: '${{ github.repository }}'.split('/')[1],
              issue_number: '${{ steps.get_issue.outputs.issue_number }}',
              body: 'There is a problem with the iFlow CLI issue implementation. Please check the [action logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })